services:
  mongodb:
    image: mongo:7
    container_name: gamefinder-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
    container_name: gamefinder-server
    restart: unless-stopped
    command: npm run dev
    environment:
      MONGO_DB_URL: mongodb://mongodb:27017/gamefinder
      JWT_SECRET: secret
      FRONTEND_URL: http://localhost:5173
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - mongodb
    ports:
      - "3000:3000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: gamefinder-client
    restart: unless-stopped
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server
    ports:
      - "5173:5173"

volumes:
  mongo_data:
